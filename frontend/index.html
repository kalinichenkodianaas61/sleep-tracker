<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер сну</title>
  <style>
    :root {
      --bg: #14172b;
      --panel: #1d2140;
      --line: #343a69;
      --text: #e8eaf6;
      --muted: #9aa0c7;
      --accent: #f2c14e;
      --bad: #ff8a80;
      --good: #8ee6a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin: 0 0 1.5rem; }
    h1::after {
      content: "";
      display: block;
      width: 3rem;
      height: 3px;
      margin-top: .5rem;
      background: var(--accent);
    }
    form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .75rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    label { display: flex; flex-direction: column; font-size: .9rem; color: var(--muted); }
    input {
      margin-top: .25rem;
      padding: .5rem;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    form button {
      grid-column: 1 / -1;
      padding: .6rem;
      font: inherit;
      font-weight: 600;
      color: #14172b;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #status { min-height: 1.5rem; margin: .75rem 0; }
    #status.ok { color: var(--good); }
    #status.err { color: var(--bad); }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--line);
    }
    li .quality { color: var(--accent); font-weight: 600; margin-left: .5rem; }
    li button {
      padding: .25rem .6rem;
      font: inherit;
      font-size: .85rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    li button:hover { color: var(--bad); border-color: var(--bad); }
    .empty { color: var(--muted); padding: .6rem 0; }
    @media (max-width: 420px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Трекер сну</h1>

    <form id="form">
      <label>Дата
        <input id="date" type="date" required>
      </label>
      <label>Якість сну (1-100)
        <input id="quality" type="number" min="1" max="100" step="1" required>
      </label>
      <label>Заснула
        <input id="sleep" type="time" required>
      </label>
      <label>Прокинулась
        <input id="wake" type="time" required>
      </label>
      <button>Додати запис</button>
    </form>

    <p id="status" role="status"></p>
    <ul id="list"></ul>
  </main>

  <script>
    // API address (адреса API)
    const API = "https://api.kalinichenko2.pp.ua";

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    function setStatus(text, ok) {
      // textContent, not innerHTML: protects against XSS (textContent, а не innerHTML: захист від XSS)
      statusEl.textContent = text;
      statusEl.className = ok ? "ok" : "err";
    }

    // The API expects DD-MM-YY, <input type="date"> gives YYYY-MM-DD
    // (API чекає ДД-ММ-РР, а поле date дає РРРР-ММ-ДД)
    function toApiDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}-${month}-${year.slice(2)}`;
    }

    async function load() {
      try {
        const response = await fetch(API + "/records");
        const records = await response.json();
        listEl.innerHTML = ""; // clearing only, no user data here (тільки очищення, без даних користувача)

        if (records.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Записів ще немає. Додай перший.";
          listEl.appendChild(empty);
          return;
        }

        for (const record of records) {
          const li = document.createElement("li");

          const info = document.createElement("span");
          info.textContent = `${record.date}  ${record.sleep} → ${record.wake}`;

          const quality = document.createElement("span");
          quality.className = "quality";
          quality.textContent = `якість ${record.quality}`;
          info.appendChild(quality);

          const del = document.createElement("button");
          del.type = "button";
          del.textContent = "Видалити";
          del.addEventListener("click", () => removeRecord(record.id));

          li.appendChild(info);
          li.appendChild(del);
          listEl.appendChild(li);
        }
      } catch (error) {
        setStatus("Не вдалося завантажити записи. Перевір, чи запущені waitress і тунель.", false);
      }
    }

    async function removeRecord(id) {
      try {
        const response = await fetch(`${API}/records/${id}`, { method: "DELETE" });
        if (response.ok) {
          setStatus("Запис видалено", true);
        } else {
          setStatus("Не вдалося видалити запис", false);
        }
      } catch (error) {
        setStatus("Немає зв'язку з сервером", false);
      }
      load();
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        date: toApiDate(document.getElementById("date").value),
        sleep: document.getElementById("sleep").value,
        wake: document.getElementById("wake").value,
        quality: Number(document.getElementById("quality").value),
      };
      try {
        const response = await fetch(API + "/records", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (response.ok) {
          setStatus("Запис додано", true);
          event.target.reset();
        } else {
          setStatus("Помилка: " + result.error, false);
        }
      } catch (error) {
        setStatus("Немає зв'язку з сервером", false);
      }
      load();
    });

    load();
  </script>
</body>
</html>
